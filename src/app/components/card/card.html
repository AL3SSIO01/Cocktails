<div class="col">
  <article class="card tropical-cocktail-card h-100 overflow-hidden">
    <div class="card-img-wrapper position-relative">
      <img [src]="cocktail.strDrinkThumb" class="card-img-top object-fit-cover" loading="lazy" />
      <div class="img-gradient-overlay"></div>
      <button
        type="button"
        class="btn btn-favorite position-absolute top-0 end-0 m-3 d-flex align-items-center justify-content-center"
        (click)="gestisciPreferiti(cocktail)"
        [class.is-favorite]="preferitiIds().has(cocktail.idDrink)"
      >
        <i
          class="bi"
          [class.bi-heart]="!preferitiIds().has(cocktail.idDrink)"
          [class.bi-heart-fill]="preferitiIds().has(cocktail.idDrink)"
        ></i>
      </button>
    </div>

    <!-- Contenuto Card -->
    <div class="card-body d-flex flex-column justify-content-between p-3">
      <div>
        <h2 class="h5 card-title text-white fw-bold mb-2">{{ cocktail.strDrink }}</h2>
      </div>

      <div
        class="d-flex align-items-center justify-content-between pt-2 border-top border-white-10"
      >
        <span class="badge tag-badge">{{ cocktail.strAlcoholic }}</span>
        <a class="btn-details-link text-decoration-none small fw-semibold">
          Dettagli <i class="bi bi-chevron-right ms-1"></i>
        </a>
      </div>
    </div>
  </article>
</div>
